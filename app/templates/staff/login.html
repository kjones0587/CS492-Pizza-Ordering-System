{% extends "base.html" %}

{% block title %}Staff Portal Login - {{ restaurant.name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-shield-lock fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Staff Portal Login</h3>
                    <p class="text-muted small">Sign in to manage kitchen orders and store operations.</p>
                </div>

                <div class="alert alert-info border-0 rounded-3 small mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <i class="bi bi-info-circle-fill me-1"></i>
                        <strong>Demo Manager Account:</strong><br>
                        Username: <code>manager</code> &bull; Password: <code>pizza123</code>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="document.getElementById('username').value='manager';document.getElementById('password').value='pizza123';">
                        <i class="bi bi-magic me-1"></i> Auto-Fill
                    </button>
                </div>

                <form method="POST" action="{{ url_for('staff.login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me" checked>
                            <label class="form-check-label small text-muted" for="remember_me">
                                Keep me signed in
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-pizza-primary btn-lg w-100 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Portal
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('menu.index') }}" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left me-1"></i> Back to Public Menu
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
